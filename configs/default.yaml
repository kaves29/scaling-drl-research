# Experiment setup
experiment:
  num_seeds: 5
  num_envs: 4

environments:
  Reacher:
    env_id: "Reacher-v5"
    total_timesteps: 500000

  Swimmer:
    env_id: "Swimmer-v5"
    total_timesteps: 1000000

  Hopper:
    env_id: "Hopper-v5"
    total_timesteps: 3000000

training:
  learning_rate: 3e-4
  batch_size: 64
  n_steps: 2048
  n_epochs: int = 10

dst:
  prune_interval: 2048
  actor_sparsity_ratio: 0.8
  actor_eplison: 1e-8
  regrow_ratio: 0.1

logging:
  project: str = sparse-ppo-drl-"research" 