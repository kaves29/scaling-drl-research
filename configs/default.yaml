# Experiment setup
experiment:
  num_seeds: 5
  num_envs: 4

environments:
  Reacher-v5:
    total_timesteps: 500000

  Swimmer-v5:
    total_timesteps: 1000000

  Hopper-v5:
    total_timesteps: 3000000

training:
  learning_rate: 3e-4
  batch_size: 64
  n_steps: 2048
  n_epochs: 10

dst:
  prune_interval: 500
  sparsity_ratio: 0.8
  regrow_ratio: 0.1
  gradient_history_window: 10000

algorithm:
  actor_saliency: median_var # gradient median and variance

logging:
  project: sparseppo 