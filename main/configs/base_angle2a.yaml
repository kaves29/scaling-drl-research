##################################################################################
# Common (mirrors base_sac.yaml; Angle 2A reuses the same env/buffer/agent
# hyperparameter *templates*, but critic depth/width are supplied per-role
# below, never from these top-level fields)
##################################################################################

project_name: 'EchoCritic'
exp_name: 'angle_2a'
seed: 108
server: 'local'

env_name: 'reacher-hard'

##################################################################################
# Training (shared hyperparameters for every agent Angle 2A trains: actor
# architecture, learning rates, buffer sizing, interaction-step accounting.
# Only the *critic* architecture differs per role, and is intentionally NOT
# specified here — see angle_2_a: below.)
##################################################################################

actor_sparsity: 0.0
actor_num_blocks: 1
actor_hidden_dim: 128

critic_sparsity: 0.0
# Deliberately left mandatory (no default): Angle 2A must NEVER read a
# top-level critic_num_blocks/critic_hidden_dim. Each of the four agents
# (D_5x768, R_5x768, D_7x1024, R_7x1024) gets its own explicit architecture
# from angle_2_a.scaled_a / scaled_b / reference below. If any code path
# ever accidentally falls back to cfg.agent.critic_num_blocks instead of the
# per-role override, this MUST fail loudly rather than silently using 2/512.
critic_num_blocks: ???
critic_hidden_dim: ???

eff_episode_len: ${eval:'${env.max_episode_steps} / ${env.action_repeat}'}
gamma: ${eval:'max(min((${eff_episode_len} / 5 - 1) / (${eff_episode_len} / 5), 0.995), 0.95)'}
n_step: 1

num_train_envs: ${env.num_train_envs}
num_env_steps: ${env.num_env_steps}
action_repeat: ${env.action_repeat}

num_interaction_steps: ${eval:'${num_env_steps} / (${num_train_envs} * ${action_repeat})'}
updates_per_interaction_step: 5
num_eval_episodes: 5

defaults:
  - _self_
  - agent: sac_simba
  - buffer: numpy_uniform
  - env: dmc_medium

##################################################################################
# Angle 2A: scaled-critic vs. healthy-reference degradation-onset comparison
##################################################################################

angle_2_a:
  # Which --experiment name the Angle 1 onset ledger entries were logged
  # under (see utils/onset_ledger.py). Angle 2A never re-detects onsets
  # itself; it only looks them up.
  onset_source_experiment: 'angle_1'
  onset_ledger_root: 'results/ledgers'

  # Fixed experimental-protocol constant (not an architecture value). Kept
  # configurable for testability, but the scientific protocol requires
  # exactly 10; do not lower it to save compute.
  num_probes_per_source: 10
  # Fallback only, used when angle_2_a.r_calibration.enabled is false below -
  # otherwise the calibrated R replaces this everywhere (main comparison and
  # prereq_check alike). This was the sole, unvalidated fixed value before
  # r_calibration.py - see research-methodology.md's Angle 2A section.
  num_mc_rollouts: 15

  # Whether to also compute/load the healthy-vs-healthy null-baseline
  # distribution for this environment (see
  # experiments/angle_2a/pool_null_baseline.py - drawn from the shared
  # baseline-calibration pool, computed once per environment and cached,
  # not trained fresh per seed).
  run_null_baseline: true

  # Construct-validity prerequisite check (see experiments/angle_2a/prereq_check.py
  # and research-methodology.md's Angle 2A section): runs before the main
  # comparison, on seeds dedicated to this check alone - never the main
  # comparison's cfg.seed, never reused or drawn from it, chosen before any
  # main-analysis result exists. Descriptive only: always completes and the
  # main comparison always proceeds regardless of what it finds (no
  # algorithmic pass/fail - see prereq_check.py's module docstring for why).
  prereq_check:
    enabled: true
    # Placeholder values - replace with real dedicated seeds of your
    # choosing before running for real. Must be seeds Angle 1 has already
    # been run for (critic_degradation=true) against BOTH scaled_a and
    # scaled_b's architectures, for this same environment - this check looks
    # up their onsets the same way the main comparison does and does not
    # train Angle 1 itself.
    seeds: [9001, 9002, 9003]
    # Burn-in fraction defining the "pre" checkpoint step (as a fraction of
    # this agent's own num_interaction_steps). Should match
    # configs/base_sac.yaml's onset_detection.acf_ccf_burn_in_fraction /
    # analysis/window_calibration.py's BURN_IN_FRACTION - NOT auto-synced
    # with that value; keep in sync manually if it ever changes there.
    burn_in_fraction: 0.25
    num_probes: 10
    # num_mc_rollouts removed: superseded by the calibrated R (see
    # angle_2_a.r_calibration below), used here unconditionally same as the
    # main comparison - do not resurrect a separately-configurable value.

  # Per-environment MC rollout-count (R) calibration (see
  # experiments/angle_2a/r_calibration.py and research-methodology.md's
  # Angle 2A section) - replaces the fixed, previously-unvalidated R=15
  # above with the smallest R such that sigma_rollout/sqrt(R) stays
  # comfortably below this environment's null-distribution 95th-percentile
  # threshold. One-time, cached per environment under
  # results/angle_2a_r_calibration/{environment}/.
  r_calibration:
    enabled: true
    # Placeholder - replace with a real dedicated seed of your choosing
    # before running for real. Trains a dedicated healthy-vs-healthy
    # reference pair, decoupled from any main-comparison or prereq_check
    # seed, solely to measure this environment's sigma_rollout and null-
    # distribution threshold.
    calibration_seed: 9501
    # Same burn-in convention as prereq_check above - the calibration pair
    # trains only to this fraction of a full run, not to any specific t*.
    burn_in_fraction: 0.25
    # Representative (s,a) pairs sampled to measure sigma_rollout; standard
    # deviation is computed WITHIN each pair's own repeated rollouts only,
    # never pooled across pairs (see r_calibration.py) - then the max across
    # pairs is used, not the average (conservative: sized for the noisiest
    # observed state, not a typical one).
    num_representative_pairs: 5
    num_rollouts_for_sigma: 50
    # Target: SE <= threshold_95 / se_margin_divisor.
    se_margin_divisor: 2.0
    # Hard cap on the calibrated R regardless of what the margin above would
    # ideally require - if the ideal R exceeds this, the cap is used instead
    # and the environment's results are explicitly flagged as underpowered
    # relative to the margin target, rather than silently spending
    # unbounded compute or loosening the margin. Project decision,
    # confirmed 2026-09-06.
    r_cap: 35

  # --- Required per-role critic architectures. No defaults on purpose: ---
  # These MUST be supplied via --overrides every time (e.g.
  # angle_2_a.scaled_a.critic_num_blocks=7). `???` is OmegaConf's mandatory-
  # value marker: validate_angle2a_config() (experiments/angle_2a/config.py)
  # relies on this to fail clearly when a value wasn't explicitly supplied.
  # Do NOT fill these in with concrete numbers, even ones that happen to
  # match your current experiment plan - that silently reintroduces a hidden
  # default the scientific protocol explicitly forbids (a run with no
  # --overrides would otherwise proceed using whatever numbers are here).
  scaled_a:
    critic_num_blocks: ???
    critic_hidden_dim: ???
  scaled_b:
    critic_num_blocks: ???
    critic_hidden_dim: ???
  reference:
    critic_num_blocks: ???
    critic_hidden_dim: ???
