##################################################################################
# HumanoidBench (H1, no hands) for Exp 1/2: SimBa's configs/env/hb_locomotion.yaml
# settings. Its episodic flag turns on clipped double-Q (agent.critic_use_cdq), as in
# SimBa; DMC and MyoSuite stay single-Q (amendment (z)).
##################################################################################

env_type: 'humanoid_bench'
env_name: ${env_name}
num_env_steps: 2_000_000
episodic: true

seed: ${seed}
num_train_envs: 1
num_eval_envs: 1
no_termination: false
action_repeat: 2
rescale_action: true
reward_scale: 1
max_episode_steps: 1000
