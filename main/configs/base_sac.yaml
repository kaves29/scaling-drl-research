##################################################################################
# Common
##################################################################################

project_name: 'EchoCritic'
exp_name: 'pilot'
seed: 108
server: 'local'

env_name: 'reacher-hard'
##################################################################################
# Training
##################################################################################
actor_sparsity: 0.0
actor_num_blocks: 1
actor_hidden_dim: 128

critic_sparsity: 0.0
critic_num_blocks: 2
critic_hidden_dim: 512
# gamma value is set with a heuristic from TD-MPCv2
eff_episode_len: ${eval:'${env.max_episode_steps} / ${env.action_repeat}'}
gamma: ${eval:'max(min((${eff_episode_len} / 5 - 1) / (${eff_episode_len} / 5), 0.995), 0.95)'}
n_step: 1

num_train_envs: ${env.num_train_envs}
num_env_steps: ${env.num_env_steps}
action_repeat: ${env.action_repeat}

num_interaction_steps: ${eval:'${num_env_steps} / (${num_train_envs} * ${action_repeat})'}
updates_per_interaction_step: 5           # number of updates per interaction step.
evaluation_per_interaction_step: 50_000   # evaluation frequency per interaction step.
recording_per_interaction_step: ${num_interaction_steps}   # video recording frequency per interaction step.
logging_per_interaction_step: 3_000       # logging frequency per interaction step.
num_eval_episodes: 5
num_record_episodes: 0

defaults:
- _self_
- agent: sac_simba
- buffer: numpy_uniform
- env: dmc_medium


##################################################################################
# Angle 1: EchoCritic onset tracking (opt-in)
##################################################################################

# Enable collection + post-hoc onset analysis for critic degradation.
critic_degradation: false
# Enable collection + post-hoc onset analysis for pathology propagation.
# NOTE: propagation is only ever analyzed for runs where critic degradation
# was also detected; see analysis/onset_detection.py.
pathology_prop: false

# N (sustain window) and W (propagation/lag window) are calibrated
# per-environment from the 5-seed default-SimBa baseline data via ACF/CCF -
# see analysis/window_calibration.py and research-methodology.md's Onset
# Definitions. Not config values (no sustain_window/propagation_window
# fields here); persisted to
# results/baselines/{architecture}/{environment}/window_params.json.
onset_detection:
  # Burn-in fraction discarded before computing the ACF (N) / CCF (W) - a
  # practical convention, not statistically derived. See research-methodology.md.
  acf_ccf_burn_in_fraction: 0.25
  # CCF candidate lag search range for W, as a fraction of the (post-burn-in)
  # segment length, searched symmetrically (+/-) - see
  # analysis/window_calibration.py for why a negative-lag peak is excluded.
  ccf_lag_fraction_cap: 0.20
  # percentile of the baseline distribution used as the exceedance threshold
  baseline_percentile: 95
  # number of default-SimBa baseline seeds used for calibration; must match
  # baseline_seeds below exactly - see analysis/baseline_calibration.py.
  baseline_num_seeds: 5
  # seeds of the 5 default-SimBa calibration runs (must have been trained
  # with critic_degradation=true so their metrics were persisted)
  baseline_seeds: [1, 2, 3, 4, 5]
  # Canonical "default SimBa" architecture id (see
  # scale_rl.common.logger.get_architecture_id) that baseline calibration
  # must ultimately compare against. Used both as the fallback for
  # `baseline_architecture` below and to reject a self-baseline (a scaled
  # run accidentally calibrating against itself).
  default_architecture: 'D2W512'
  # architecture id of the "default SimBa" baseline. Leave null to fall back
  # to default_architecture above (correct for any run). Only ever needs to
  # be set explicitly if calibrating against a non-standard default.
  baseline_architecture: null
  # --experiment name the 5 baseline runs were logged under. Leave null to
  # assume they were logged under this same run's --experiment name.
  baseline_experiment: null
  # Force baseline recalibration even if a cached threshold file exists.
  # Normally unnecessary: the cache is automatically invalidated whenever
  # the underlying baseline seeds' persisted metric files change (see
  # analysis/baseline_calibration.py's source fingerprinting). Set true to
  # force a recompute regardless (e.g. after changing baseline_percentile).
  force_baseline_recompute: false
  # version identifiers persisted into the ledger's *_method columns
  critic_degradation_method_version: 'td_variance_p95_sustained_v1'
  propagation_method_version: 'actor_grad_cosine_p95_windowed_v1'

